[profile.default]
# no matter the profile, we want to kill tests that hanged on something
slow-timeout = { period = "60s", terminate-after = 3 }

# The usdt bridge e2e runs a real cggmp21 DKG (100s+ per federation setup)
# plus a full deposit->claim->withdraw round trip; give it 30 minutes.
[[profile.default.overrides]]
filter = 'test(test_usdt_bridge_end_to_end)'
slow-timeout = { period = "60s", terminate-after = 30 }

# define `dev` to allow running cargo and nextest with the same profile name
# inherits default profile config
[profile.dev]


[profile.release]
fail-fast = true
failure-output = "immediate"
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci]
fail-fast = true
failure-output = "immediate"
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = 'test(flaky_)'
retries = 3
